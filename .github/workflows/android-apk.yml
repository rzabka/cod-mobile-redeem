name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter Android scaffold
        run: |
          flutter create --platforms android --project-name cod_mobile_redeem --org com.codmobile.redeem .
          flutter pub add webview_flutter shared_preferences
      - name: Analyze
        run: flutter analyze lib/main.dart
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cod-mobile-redeem-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
